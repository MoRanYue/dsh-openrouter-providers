# Automatically publish to npm via OIDC Trusted Publishing when a version tag
# (vX.Y.Z) is pushed, and on manual workflow_dispatch.
#
# No NODE_AUTH_TOKEN: authentication comes from GitHub's OIDC token, which npm
# validates against the Trusted Publisher configured on npmjs.com for this
# package (see README). npm >= 11.5.1 is required for OIDC publishing.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC + provenance attestation require id-token write access.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm (OIDC publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check version matches tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version $VERSION does not match tag $TAG" >&2
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
