# Automatically publish to npm via OIDC Trusted Publishing when a version tag
# (vX.Y.Z) is pushed, then create the matching GitHub Release.
#
# No NODE_AUTH_TOKEN: authentication comes from GitHub's OIDC token, which npm
# validates against the Trusted Publisher configured on npmjs.com for this
# package (see README). npm >= 11.5.1 is required for OIDC publishing.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write is what lets this job create the GitHub Release.
      contents: write
      # OIDC + provenance attestation require id-token write access.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm (OIDC publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check version matches tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json version $VERSION does not match tag $TAG" >&2
            exit 1
          fi

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public

      # Runs only after a successful publish, so a Release always records a
      # version that is actually on npm. Tag pushes only: a manual dispatch has
      # no tag ref, and its version check stops the run before this step.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          # Re-running a tag push must not fail on the release it already made.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "npm: https://www.npmjs.com/package/dsh-openrouter-providers/v/${VERSION} · 安装：pnpm add dsh-openrouter-providers@${VERSION}"
